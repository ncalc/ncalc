- name: ShouldHandleIntegers
  resultType: int
  compileToLambda: true
  cases:
  - input: 1+2
    output: 3
  - input: 1-2
    output: -1
  - input: 2*2
    output: 4
  - input: 10/2
    output: 5
  - input: 7%2
    output: 1
- name: Issue1
  parameters:
    x:
      type: Decimal
      value: '5'
    a:
      type: Decimal
      value: '6'
    b:
      type: Decimal
      value: '7'
  resultType: float
  compileToLambda: true
  cases:
  - input: 2 + 2 - a - b - x
    output:
      type: Single
      value: '-14'
- name: ShouldHandleBuiltInFunctions
  resultType: bool
  compileToLambda: true
  cases:
  - input: if(true, true, false)
    output: true
  - input: in(3, 1, 2, 3, 4)
    output: true
- name: ShouldHandleNumericBuiltInFunctions
  compileToLambda: true
  cases:
  - input: Min(3,2)
    output: 2.0
  - input: Min(3.2,6.3)
    output: 3.2
  - input: Max(2.6,9.6)
    output: 9.6
  - input: Max(9,6)
    output: 9.0
  - input: Pow(5,2)
    output: 25.0
- name: ShouldHandleFloatIfFunction
  compileToLambda: true
  cases:
  - input: if(true, 1, 0.0)
    output: 1.0
  - input: if(true, 1.0, 0)
    output: 1.0
  - input: if(true, 1.0, 0.0)
    output: 1.0
- name: ShouldHandleIntIfFunction
  compileToLambda: true
  cases:
  - input: if(true, 1, 0)
    output: 1
- name: ShouldHandleStringIfFunction
  compileToLambda: true
  cases:
  - input: if(true, 'a', 'b')
    output: a
- name: ShouldAllowPowWithDecimals
  configuration:
    parsing:
      floatingPointNumberType: Decimal
    evaluation:
      math:
        floatingPointNumberType: Decimal
  resultType: decimal
  compileToLambda: true
  cases:
  - input: Pow(3.1, 2)
    output:
      type: Decimal
      value: '9.61'
- name: ShouldAllowExponentiationWithDifferentTypes
  configuration:
    evaluation:
      math:
        overflowProtection: true
  resultType: int
  compileToLambda: true
  cases:
  - input: '[a] ** [b]'
    output: 4
    parameters:
      a: 2
      b: 2
  - input: '[a] ** [b]'
    output: 4
    parameters:
      a: 2.0
      b: 2
  - input: '[a] ** [b]'
    output: 4
    parameters:
      a: 2
      b: 2.0
  - input: '[a] ** [b]'
    output: 4
    parameters:
      a: 2.0
      b: 2.0
- name: ShouldHandleInOperatorWithVariables_Int
  parameters:
    y:
      type: Int32[]
  resultType: bool
  compileToLambda: true
  cases:
  - input: x in y
    output: true
    parameters:
      x: 3
      y:
        value:
        - 1
        - 2
        - 3
  - input: x in y
    output: false
    parameters:
      x: 4
      y:
        value:
        - 1
        - 2
        - 3
  - input: x in y
    output: false
    parameters:
      x: 7
      y:
        value: []
- name: ShouldHandleInOperatorWithVariables_ListInt
  parameters:
    x: 3
    y:
      type: List<Int32>
      value:
      - 1
      - 2
      - 3
  resultType: bool
  compileToLambda: true
  cases:
  - input: x in y
    output: true
- name: ShouldHandleInOperatorWithVariables_Double
  parameters:
    x: 3.0
    y:
      type: Double[]
  resultType: bool
  compileToLambda: true
  cases:
  - input: x in y
    output: true
    parameters:
      y:
        value:
        - 1.0
        - 2.0
        - 3.0
  - input: x in y
    output: false
    parameters:
      y:
        value:
        - 1.1
        - 2.2
        - 3.3
- name: ShouldUseDecimalsWithDecimalAsDefault
  configuration:
    parsing:
      floatingPointNumberType: Decimal
    evaluation:
      math:
        floatingPointNumberType: Decimal
  parameters:
    x:
      type: Decimal
      value: '3.1'
  resultType: decimal
  compileToLambda: true
  cases:
  - input: Abs(x)
    output:
      type: Decimal
      value: '3.1'
  - input: Ceiling(x)
    output:
      type: Decimal
      value: '4'
  - input: Floor(x)
    output:
      type: Decimal
      value: '3'
  - input: Sign(x)
    output:
      type: Decimal
      value: '1'
  - input: Truncate(x)
    output:
      type: Decimal
      value: '3'
- name: ShouldHandleLikeOperator
  resultType: bool
  compileToLambda: true
  cases:
  - input: x like '%est'
    output: true
    parameters:
      x: test
  - input: x not like '%est'
    output: false
    parameters:
      x: test
  - input: x like '%est'
    output: false
    parameters:
      x: TEST
  - input: x not like '%est'
    output: true
    parameters:
      x: TEST
  - input: x like '%est'
    output: true
    configuration:
      evaluation:
        stringComparer: currentCultureIgnoreCase
    parameters:
      x: TEST
  - input: x not like '%est'
    output: false
    configuration:
      evaluation:
        stringComparer: currentCultureIgnoreCase
    parameters:
      x: TEST
  - input: x like '%is a%'
    output: true
    parameters:
      x: this is a test
  - input: x not like '%is a%'
    output: false
    parameters:
      x: this is a test
  - input: x like '%ITS A%'
    output: false
    parameters:
      x: this is a test
  - input: x not like '%ITS A%'
    output: true
    parameters:
      x: this is a test
  - input: x like '%\%'
    output: true
    parameters:
      x: 100%
  - input: x not like '%\%'
    output: false
    parameters:
      x: 100%
  - input: x like '%\%'
    output: false
    parameters:
      x: '1000'
  - input: x not like '%\%'
    output: true
    parameters:
      x: '1000'
  - input: x like '%\_%'
    output: true
    parameters:
      x: Hello_world
  - input: x not like '%\_%'
    output: false
    parameters:
      x: Hello_world
  - input: x like '%\_%'
    output: false
    parameters:
      x: Hello-world
  - input: x not like '%\_%'
    output: true
    parameters:
      x: Hello-world
- name: ShouldHandleInOperator_String
  resultType: bool
  compileToLambda: true
  cases:
  - input: x in ('a','test','z')
    output: true
    parameters:
      x: test
  - input: x not in ('a','test','z')
    output: false
    parameters:
      x: test
  - input: x in ('a','test','z')
    output: false
    parameters:
      x: TEST
  - input: x not in ('a','test','z')
    output: true
    parameters:
      x: TEST
  - input: x in ('a','test','z')
    output: true
    configuration:
      evaluation:
        stringComparer: currentCultureIgnoreCase
    parameters:
      x: TEST
  - input: x not in ('a','test','z')
    output: false
    configuration:
      evaluation:
        stringComparer: currentCultureIgnoreCase
    parameters:
      x: TEST
  - input: x in ('this','is','a','test')
    output: true
    parameters:
      x: this
  - input: x not in ('this','is','a','test')
    output: false
    parameters:
      x: this
  - input: x in ('this','is','a','test')
    output: false
    parameters:
      x: THIS
  - input: x not in ('this','is','a','test')
    output: true
    parameters:
      x: THIS
  - input: x in ('this','is','a','test')
    output: true
    configuration:
      evaluation:
        stringComparer: currentCultureIgnoreCase
    parameters:
      x: THIS
  - input: x not in ('this','is','a','test')
    output: false
    configuration:
      evaluation:
        stringComparer: currentCultureIgnoreCase
    parameters:
      x: THIS
- name: ShouldHandleInOperatorWithVariables_String
  parameters:
    y:
      type: String[]
  resultType: bool
  compileToLambda: true
  cases:
  - input: x in y
    output: true
    parameters:
      x: test
      y:
        value:
        - a
        - test
        - z
  - input: x in y
    output: false
    parameters:
      x: nope
      y:
        value:
        - a
        - test
        - z
  - input: x in y
    output: false
    parameters:
      x: x
      y:
        value: []
  - input: x in y
    output: true
    parameters:
      x: dup
      y:
        value:
        - dup
        - dup
  - input: x in y
    output: false
    parameters:
      x: Test
      y:
        value:
        - a
        - test
        - z
- name: ShouldHandleEscapeLikeFunction
  parameters:
    x: 100%_
  compileToLambda: true
  cases:
  - input: EscapeLike(x)
    output: 100\%\_
  - input: EscapeLike(x)
    output: 100\%\_
    resultType: string
- name: ShouldHandleOverflowInt
  throws: OverflowException
  configuration:
    evaluation:
      math:
        overflowProtection: true
  resultType: int
  compileToLambda: true
  cases:
  - input: '[a] + [b]'
    parameters:
      a: 2147483647
      b: 2147483647
  - input: '[a] - [b]'
    parameters:
      a: -2147483648
      b: 2147483647
  - input: '[a] * [b]'
    parameters:
      a: 2147483647
      b: 2147483647
- name: ShouldHandleCoalesceOperatorWithParameters
  compileToLambda: true
  resultType: string
  cases:
  - input: '[value] ?? ''fallback'''
    output: fallback
    parameters:
      value: null
